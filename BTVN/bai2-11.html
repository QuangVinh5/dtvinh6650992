<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.11</title>
</head>
<body>

    <form name="frmDangKy" method="post" action=""
          style="border: 3px solid #CC33CC; background-color: #FFF9D9;
                 padding: 15px; font-family: Arial;">

        <table align="center" cellpadding="3" cellspacing="2">
            <tr>
                <td colspan="3" align="center">
                    <font size="9" color="#555555">Đăng ký <b>Thông tin</b>
                    </font>
                </td>
            </tr>

            <tr>
                <td colspan="3" align="center">
                    <font size="3">
                        Để nhận thông tin tư vấn về chương trình, vui lòng điền đầy đủ thông tin dưới đây,<br>
                        chúng tôi sẽ liên hệ với bạn sớm nhất
                    </font>
                </td>
            </tr>
            <tr>
                <td>Họ và tên</td>
                <td>
                    <input type="text" name="hoten" size="40" required>
                    <font color="red">*</font>
                </td>
            </tr>
            <tr>
                <td>Năm sinh</td>
                <td>
                    <input type="text" name="namsinh" size="40" required>
                    <font color="red">*</font>
                </td>
            </tr>

            <tr>
                <td>Điện thoại</td>
                <td>
                    <input type="text" name="dienthoai" size="40" required>
                    <font color="red">*</font>
                </td>
            </tr>
            <tr>
                <td>Email</td>
                <td>
                    <input type="text" name="email" size="40">
                </td>
                <td></td>
            </tr>
            <tr>
                <td>Sinh viên trường</td>
                <td>
                    <input type="text" name="truong" size="40">
                </td>
                <td></td>
            </tr>

            <tr>
                <td>Khóa</td>
                <td>
                    <input type="text" name="khoa" size="40">
                </td>
                <td></td>
            </tr>
            <tr>
                <td>Mã bảo mật:</td>
                <td>
                    <input type="text" name="mabaomat" size="20">
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <font size="2">
                        <span style="text-decoration: overline;">530 11 9</span>
                    </font>
                </td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <input type="submit" value="ĐĂNG KÝ"
                        style="background-color: #B719D2; color: white;
                            border: none; padding: 10px 35px;
                            margin: 5px; border-radius: 6px;">
                    <input type="reset" value="LÀM LẠI"
                        style="background-color: #B719D2; color: white;
                            border: none; padding: 10px 35px;
                            margin: 5px; border-radius: 6px;">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
